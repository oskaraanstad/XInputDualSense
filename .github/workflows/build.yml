name: Build Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Test vibration forwarding
        shell: powershell
        run: ./scripts/test-rumble.ps1
      - name: Build and package
        shell: powershell
        run: ./scripts/build.ps1
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XInputDualSense-win-x64
          path: artifacts/XInputDualSense-win-x64.zip
          if-no-files-found: error
